@if (magnitudeBounds(); as bounds) {
  <section class="filters" aria-label="Filters">
    <div class="filters__group">
      <div class="filters__group-header">
        <span class="filters__label">Magnitude</span>
        <span class="filters__value">
          {{ filters().minMagnitude ?? bounds.min }}–{{ filters().maxMagnitude ?? bounds.max }}
        </span>
      </div>
      <mat-slider [min]="bounds.min" [max]="bounds.max" [step]="0.1" class="filters__slider">
        <input
          matSliderStartThumb
          [value]="filters().minMagnitude ?? bounds.min"
          (valueChange)="onMinMagnitudeChange($event)"
        />
        <input
          matSliderEndThumb
          [value]="filters().maxMagnitude ?? bounds.max"
          (valueChange)="onMaxMagnitudeChange($event)"
        />
      </mat-slider>
    </div>

    @if (timeBounds()) {
      <div class="filters__group filters__group--dates">
        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="filters__date-field">
          <mat-label>From</mat-label>
          <input
            id="from-date"
            matInput
            [matDatepicker]="fromPicker"
            [value]="fromDate()"
            [min]="minPickableDate()"
            [max]="maxPickableDate()"
            (dateChange)="onFromDateChange($event)"
          />
          <mat-datepicker-toggle matIconSuffix [for]="fromPicker" />
          <mat-datepicker #fromPicker />
        </mat-form-field>

        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="filters__date-field">
          <mat-label>To</mat-label>
          <input
            id="to-date"
            matInput
            [matDatepicker]="toPicker"
            [value]="toDate()"
            [min]="minPickableDate()"
            [max]="maxPickableDate()"
            (dateChange)="onToDateChange($event)"
          />
          <mat-datepicker-toggle matIconSuffix [for]="toPicker" />
          <mat-datepicker #toPicker />
        </mat-form-field>
      </div>
    }

    @if (isFiltered()) {
      <button mat-button type="button" class="filters__reset" (click)="onReset()">
        Reset filters
      </button>
    }
  </section>
}

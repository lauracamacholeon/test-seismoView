<aside class="viewer__sidebar" aria-label="Earthquake filters and list">
  @switch (status()) {
    @case ('loading') {
      <p class="viewer__placeholder">Loading earthquakes…</p>
    }
    @case ('error') {
      <p class="viewer__placeholder">{{ error() }}</p>
    }
    @default {
      <p class="viewer__placeholder">{{ total() }} earthquakes loaded</p>
    }
  }
</aside>

<section class="viewer__map" aria-label="Earthquake map">
  <p class="viewer__placeholder">Map</p>
</section>
